services:
  db:
    image: public.ecr.aws/docker/library/postgres:15
    container_name: campusconnect_db
    environment:
      POSTGRES_USER: brian
      POSTGRES_PASSWORD: password
      POSTGRES_DB: campusconnect
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brian -d campusconnect"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: campusconnect_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://brian:password@db:5432/campusconnect
      WEB_CONCURRENCY: "2"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: public.ecr.aws/docker/library/nginx:alpine
    container_name: campusconnect_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
