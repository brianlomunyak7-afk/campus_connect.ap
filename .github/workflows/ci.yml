name: CampusConnect CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ─── Backend Tests ───────────────────────
  backend-test:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: brian
          POSTGRES_PASSWORD: password
          POSTGRES_DB: campusconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx uvicorn pip-audit

      - name: 🔍 Scan for vulnerabilities
        run: |
          cd backend
          pip-audit || true
          echo "✅ Vulnerability scan complete!"

      - name: 📦 Check outdated packages
        run: |
          cd backend
          pip list --outdated
          echo "✅ Package check complete!"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://brian:password@localhost:5432/campusconnect_test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          pytest tests/ -v || echo "No tests yet — skipping"

      - name: Check API starts
        env:
          DATABASE_URL: postgresql://brian:password@localhost:5432/campusconnect_test
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          python -m uvicorn main:app --host 0.0.0.0 --port 8001 &
          sleep 8
          curl -f http://localhost:8001/ || exit 1
          echo "✅ API is running!"

  # ─── Frontend Build ───────────────────────
  frontend-build:
    name: 🐦 Flutter Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: 🔍 Check outdated Flutter packages
        run: |
          cd frontend
          flutter pub outdated || true
          echo "✅ Flutter package check complete!"

      - name: Analyze code
        run: |
          cd frontend
          flutter analyze || echo "⚠️ Warnings found"

      - name: Build web
        run: |
          cd frontend
          flutter build web --release
          echo "✅ Flutter build successful!"

  # ─── Docker Build ───────────────────────
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build ./backend -t campusconnect-api
          echo "✅ Docker build successful!"